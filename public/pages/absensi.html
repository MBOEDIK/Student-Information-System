<div class="page active">
  <div class="page-header">
    <h1>Laporan Absensi Harian</h1>
  </div>

  <div id="admin-section" class="hidden">
    <div class="card">
      <div class="card__body">
        <div class="form-group" style="max-width: 240px">
          <label class="form-label" for="filter-tanggal">Filter Tanggal</label>
          <input type="date" class="form-input" id="filter-tanggal" />
        </div>
      </div>
    </div>

    <div class="stats-row" id="stats-container" style="margin-top: 20px">
      <div class="stat-card">
        <div class="stat-card__icon stat-card__icon--blue">
          <i class="bi bi-people"></i>
        </div>
        <div class="stat-card__info">
          <span class="stat-card__label">Total Siswa</span>
          <span class="stat-card__value" id="stat-total">0</span>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-card__icon stat-card__icon--green">
          <i class="bi bi-check-circle"></i>
        </div>
        <div class="stat-card__info">
          <span class="stat-card__label">Hadir</span>
          <span class="stat-card__value" id="stat-hadir">0</span>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-card__icon stat-card__icon--yellow">
          <i class="bi bi-exclamation-circle"></i>
        </div>
        <div class="stat-card__info">
          <span class="stat-card__label">Sakit</span>
          <span class="stat-card__value" id="stat-sakit">0</span>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-card__icon stat-card__icon--purple">
          <i class="bi bi-question-circle"></i>
        </div>
        <div class="stat-card__info">
          <span class="stat-card__label">Izin</span>
          <span class="stat-card__value" id="stat-izin">0</span>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-card__icon stat-card__icon--red">
          <i class="bi bi-x-circle"></i>
        </div>
        <div class="stat-card__info">
          <span class="stat-card__label">Alpa</span>
          <span class="stat-card__value" id="stat-alpa">0</span>
        </div>
      </div>
    </div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>No</th>
            <th>NIS</th>
            <th>Nama Siswa</th>
            <th>Mata Pelajaran</th>
            <th>Guru</th>
            <th>Status</th>
            <th>Keterangan</th>
          </tr>
        </thead>
        <tbody id="laporan-table-body">
          <tr>
            <td colspan="7" style="text-align: center; color: var(--text-muted)">
              Pilih tanggal untuk melihat laporan.
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script src="../js/absensi.js"></script>
