<div class="page active">
  <div class="page-header">
    <h1>Pendaftaran Siswa Baru</h1>
  </div>

  <div class="alert alert--success" id="alertSuccess" hidden>
    <i class="bi bi-check-circle-fill"></i>
    <span id="alertSuccessMsg"></span>
    <button class="alert__close" onclick="this.parentElement.hidden=true">&times;</button>
  </div>

  <div class="alert alert--error" id="alertError" hidden>
    <i class="bi bi-exclamation-triangle-fill"></i>
    <span id="alertErrorMsg"></span>
    <button class="alert__close" onclick="this.parentElement.hidden=true">&times;</button>
  </div>

  <div class="card">
    <div class="card__body">
      <form id="formPendaftaran" novalidate>
        <div class="form-group" id="group-nis">
          <label class="form-label" for="nis">NIS <span class="required">*</span></label>
          <input type="text" class="form-input" id="nis" name="nis" placeholder="Masukkan NIS" maxlength="20" required />
          <small class="field-error" id="err-nis"></small>
        </div>

        <div class="form-group" id="group-nama">
          <label class="form-label" for="nama">Nama Lengkap <span class="required">*</span></label>
          <input type="text" class="form-input" id="nama" name="nama" placeholder="Masukkan nama lengkap" maxlength="100" required />
          <small class="field-error" id="err-nama"></small>
        </div>

        <div class="form-group" id="group-jenis_kelamin">
          <label class="form-label" for="jenis_kelamin">Jenis Kelamin <span class="required">*</span></label>
          <select class="form-input" id="jenis_kelamin" name="jenis_kelamin" required>
            <option value="">— Pilih —</option>
            <option value="Laki-laki">Laki-laki</option>
            <option value="Perempuan">Perempuan</option>
          </select>
          <small class="field-error" id="err-jenis_kelamin"></small>
        </div>

        <div class="form-group" id="group-alamat">
          <label class="form-label" for="alamat">Alamat <span class="required">*</span></label>
          <textarea class="form-input" id="alamat" name="alamat" placeholder="Masukkan alamat lengkap" rows="3" required></textarea>
          <small class="field-error" id="err-alamat"></small>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn--primary" id="btnSimpan">
            <span class="btn__text" id="btnSimpanText">Simpan</span>
            <span class="btn__loader" id="btnSimpanLoader" hidden>
              <i class="bi bi-arrow-repeat spin"></i> Menyimpan...
            </span>
          </button>
          <button type="reset" class="btn btn--secondary" id="btnReset">Reset</button>
        </div>
      </form>
    </div>
  </div>
</div>
