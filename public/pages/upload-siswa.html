<div class="page active">
  <div class="page-header">
    <h1>Upload CSV Siswa</h1>
  </div>

  <div class="alert alert--success" id="alertSuccess" hidden>
    <i class="bi bi-check-circle-fill"></i>
    <span id="alertSuccessMsg"></span>
    <button class="alert__close" onclick="this.parentElement.hidden = true">&times;</button>
  </div>
  <div class="alert alert--error" id="alertError" hidden>
    <i class="bi bi-exclamation-triangle-fill"></i>
    <span id="alertErrorMsg"></span>
    <button class="alert__close" onclick="this.parentElement.hidden = true">&times;</button>
  </div>

  <div class="card">
    <div class="card__body">
      <div class="form-group">
        <label class="form-label">Pilih File CSV</label>
        <input type="file" class="form-input" id="csvFileInput" accept=".csv" />
        <small class="field-error" id="errFile"></small>
      </div>

      <div class="form-group">
        <label class="form-label">Contoh Format CSV</label>
        <pre class="csv-example">
nis,nama,jenis_kelamin,alamat
20240011,Budi Testing,Laki-laki,Jl. Contoh No. 1
20240012,Siti Testing,Perempuan,Jl. Contoh No. 2</pre
        >
      </div>

      <div class="form-actions">
        <button class="btn btn--primary" id="btnUploadCSV">
          <span class="btn__text" id="btnUploadText">Upload & Simpan</span>
          <span class="btn__loader" id="btnUploadLoader" hidden>
            <i class="bi bi-arrow-repeat spin"></i> Mengupload...
          </span>
        </button>
        <button class="btn btn--secondary" id="btnResetUpload">Reset</button>
      </div>
    </div>
  </div>

  <div class="table-wrapper d-none" id="resultWrapper">
    <h3 class="result-title" id="resultTitle"></h3>
    <table>
      <thead>
        <tr>
          <th>No</th>
          <th>NIS</th>
          <th>Nama</th>
          <th>Jenis Kelamin</th>
          <th>Alamat</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="resultTableBody"></tbody>
    </table>
  </div>
</div>
