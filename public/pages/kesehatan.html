<div class="page active">
  <div class="page-header">
    <h1>Catatan Kesehatan Siswa</h1>
  </div>

  <div class="alert alert--success" id="alertSuccess" hidden>
    <i class="bi bi-check-circle-fill"></i>
    <span id="alertSuccessMsg"></span>
    <button class="alert__close" onclick="this.parentElement.hidden = true">&times;</button>
  </div>

  <div class="alert alert--error" id="alertError" hidden>
    <i class="bi bi-exclamation-triangle-fill"></i>
    <span id="alertErrorMsg"></span>
    <button class="alert__close" onclick="this.parentElement.hidden = true">&times;</button>
  </div>

  <div class="card mb-24">
    <div class="card__body">
      <h3 class="mb-16">Daftar Data Kesehatan</h3>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>No</th>
              <th>NIS</th>
              <th>Nama</th>
              <th>Gol. Darah</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="kesehatanTableBody">
            <tr>
              <td colspan="5" class="text-center text-muted">Memuat data...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card__body">
      <h3 class="mb-16" id="formTitle">Tambah Data Kesehatan</h3>
      <form id="formKesehatan" novalidate>
        <input type="hidden" id="editStudentId" />

        <div class="form-group" id="group-siswa">
          <label class="form-label" for="siswa-select"
            >Pilih Siswa <span class="required">*</span></label
          >
          <select class="form-input" id="siswa-select" name="student_id" required>
            <option value="">— Pilih Siswa —</option>
          </select>
          <input
            type="text"
            class="form-input bg-gray-100 d-none"
            id="displaySiswa"
            readonly
            placeholder="Pilih siswa dari tabel di atas"
          />
          <small class="field-error" id="err-siswa"></small>
        </div>

        <div class="form-group" id="group-golongan_darah">
          <label class="form-label" for="golongan_darah">Golongan Darah</label>
          <select class="form-input" id="golongan_darah" name="golongan_darah">
            <option value="">— Pilih —</option>
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="AB">AB</option>
            <option value="O">O</option>
            <option value="Tidak Diketahui">Tidak Diketahui</option>
          </select>
          <small class="field-error" id="err-golongan_darah"></small>
        </div>

        <div class="form-group" id="group-penyakit_bawaan">
          <label class="form-label" for="penyakit_bawaan">Penyakit Bawaan</label>
          <textarea
            class="form-input"
            id="penyakit_bawaan"
            name="penyakit_bawaan"
            rows="3"
            placeholder="Masukkan penyakit bawaan (jika ada)"
          ></textarea>
        </div>

        <div class="form-group" id="group-riwayat_vaksin">
          <label class="form-label" for="riwayat_vaksin">Riwayat Vaksin</label>
          <textarea
            class="form-input"
            id="riwayat_vaksin"
            name="riwayat_vaksin"
            rows="3"
            placeholder="Masukkan riwayat vaksinasi"
          ></textarea>
        </div>

        <div class="form-group" id="group-alergi">
          <label class="form-label" for="alergi">Alergi</label>
          <textarea
            class="form-input"
            id="alergi"
            name="alergi"
            rows="3"
            placeholder="Masukkan alergi (jika ada)"
          ></textarea>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn--primary" id="btnSimpan">
            <span class="btn__text" id="btnSimpanText">Simpan</span>
            <span class="btn__loader" id="btnSimpanLoader" hidden>
              <i class="bi bi-arrow-repeat spin"></i> Menyimpan...
            </span>
          </button>
          <button type="reset" class="btn btn--secondary" id="btnReset">Reset</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="../js/kesehatan.js"></script>
