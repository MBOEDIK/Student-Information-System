<div class="page active">
  <div class="page-header">
    <h1>Catatan Kesehatan Siswa</h1>
  </div>

  <div class="card">
    <div class="card__body">
      <form id="form-kesehatan" class="form">
        <div class="form-group">
          <label for="siswa-id" class="form-label">ID Siswa</label>
          <input type="text" id="siswa-id" class="form-input" required />
        </div>

        <div class="form-group">
          <label for="keluhan" class="form-label">Keluhan</label>
          <textarea id="keluhan" class="form-input" required></textarea>
        </div>

        <div class="form-group">
          <label for="tindakan" class="form-label">Tindakan</label>
          <textarea id="tindakan" class="form-input" required></textarea>
        </div>

        <div class="form-group">
          <label for="catatan" class="form-label">Catatan Tambahan</label>
          <textarea id="catatan" class="form-input"></textarea>
        </div>

        <button type="submit" class="btn btn--primary">Simpan Catatan</button>
      </form>
    </div>
  </div>
</div>

<script src="../js/kesehatan.js"></script>
