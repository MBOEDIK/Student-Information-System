<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiSiS - Catatan Kesehatan Rekam Medis</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="misis-app">
  <main class="misis-main">
    <section class="form-card">
      <h2 class="form-card__title">Pencatatan Rekam Medis Kesehatan</h2>
      <form id="form-kesehatan" class="form-card__form">
        <div class="form-card__group">
          <label for="siswa-id" class="form-card__label">ID Siswa</label>
          <input type="text" id="siswa-id" class="form-card__input" required>
        </div>
        <div class="form-card__group">
          <label for="keluhan" class="form-card__label">Keluhan</label>
          <input type="text" id="keluhan" class="form-card__input" required>
        </div>
        <div class="form-card__group">
          <label for="tindakan" class="form-card__label">Tindakan</label>
          <input type="text" id="tindakan" class="form-card__input" required>
        </div>
        <div class="form-card__group">
          <label for="catatan" class="form-card__label">Catatan Tambahan</label>
          <textarea id="catatan" class="form-card__input"></textarea>
        </div>
        <button type="submit" class="form-card__button">Simpan Catatan Medis</button>
      </form>
    </section>
  </main>
  <script src="../js/kesehatan.js"></script>
</body>
</html>
