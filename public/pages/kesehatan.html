  <div class="page-header">

    <i class="bi bi-check-circle-fill"></i>
    <span id="alertSuccessMsg"></span>
    <button class="alert__close" onclick="this.parentElement.hidden = true">&times;</button>
  </div>

  <div class="alert alert--error" id="alertError" hidden>
    <i class="bi bi-exclamation-triangle-fill"></i>
    <span id="alertErrorMsg"></span>
    <button class="alert__close" onclick="this.parentElement.hidden = true">&times;</button>
  </div>

  <div class="card" style="margin-bottom: 24px">
    <div class="card__body">

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>No</th>
              <th>NIS</th>
              <th>Nama</th>
              <th>Gol. Darah</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="kesehatanTableBody">

              <td colspan="5" style="text-align: center; color: var(--text-muted)">

              </td>
            </tr>
          </tbody>
        </table>
      </div>

  </div>

  <div class="card">
    <div class="card__body">

      <form id="formKesehatan" novalidate>
        <input type="hidden" id="editStudentId" />

        <div class="form-group" id="group-student">
          <label class="form-label" for="displaySiswa">Siswa</label>
          <input
            type="text"
            class="form-input"
            id="displaySiswa"
            readonly
            style="background: var(--gray-100)"
            placeholder="Pilih siswa dari tabel di atas"
          />

            <option value="">— Pilih —</option>

            <option value="B">B</option>
            <option value="AB">AB</option>
            <option value="O">O</option>
            <option value="Tidak Diketahui">Tidak Diketahui</option>

            id="penyakit_bawaan"
            placeholder="Masukkan penyakit bawaan (jika ada)"
            rows="3"
          ></textarea>
          <small class="field-error" id="err-penyakit_bawaan"></small>
        </div>

        <div class="form-group" id="group-riwayat_vaksin">
          <label class="form-label" for="riwayat_vaksin">Riwayat Vaksin</label>

            id="riwayat_vaksin"
            placeholder="Masukkan riwayat vaksin"
            rows="3"
          ></textarea>
          <small class="field-error" id="err-riwayat_vaksin"></small>
        </div>

          <textarea

            id="alergi"
            placeholder="Masukkan alergi (jika ada)"
            rows="3"
          ></textarea>

      </form>
    </div>
