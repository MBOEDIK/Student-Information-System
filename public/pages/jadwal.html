<div class="page active">
  <div class="page-header">
    <h1>Penjadwalan Kelas</h1>
  </div>

  <div class="alert alert--success" id="alertSuccess" hidden>
    <i class="bi bi-check-circle-fill"></i>
    <span id="alertSuccessMsg"></span>
    <button class="alert__close" onclick="this.parentElement.hidden = true">&times;</button>
  </div>

  <div class="alert alert--error" id="alertError" hidden>
    <i class="bi bi-exclamation-triangle-fill"></i>
    <span id="alertErrorMsg"></span>
    <button class="alert__close" onclick="this.parentElement.hidden = true">&times;</button>
  </div>

  <!-- ===================== VIEW SISWA (read-only) ===================== -->
  <div id="jadwal-siswa-view" hidden>
    <div class="card mb-24">
      <div class="card__body">
        <div class="flex items-center justify-between flex-wrap gap-16">
          <h2>Jadwal Kelas Saya</h2>
          <button class="btn btn--primary btn--sm" onclick="window.downloadIcsSiswa()">
            <i class="bi bi-download"></i> Unduh .ics
          </button>
        </div>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>No</th>
                <th>Mata Pelajaran</th>
                <th>Guru</th>
                <th>Hari</th>
                <th>Jam</th>
                <th>Ruangan</th>
              </tr>
            </thead>
            <tbody id="jadwalSiswaTableBody">
              <tr>
                <td colspan="6" class="text-center text-muted">Memuat data...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  <!-- ================= END VIEW SISWA ================= -->

  <!-- ===================== VIEW GURU (read-only) ===================== -->
  <div id="jadwal-guru-view" hidden>
    <div class="card mb-24">
      <div class="card__body">
        <div class="flex items-center justify-between flex-wrap gap-16">
          <h2>Jadwal Mengajar Saya</h2>
          <button class="btn btn--primary btn--sm" onclick="window.downloadIcsGuru()">
            <i class="bi bi-download"></i> Unduh .ics
          </button>
        </div>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>No</th>
                <th>Mata Pelajaran</th>
                <th>Hari</th>
                <th>Jam</th>
                <th>Ruangan</th>
              </tr>
            </thead>
            <tbody id="jadwalGuruTableBody">
              <tr>
                <td colspan="5" class="text-center text-muted">Memuat data...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  <!-- ================= END VIEW GURU ================= -->

  <!-- ===================== VIEW ADMIN (form + tabel) ===================== -->
  <div id="jadwal-admin-view" hidden>
    <div class="card mb-24">
      <div class="card__body">
        <div class="toggle-header" id="tambahJadwalToggle">
          <h3 class="mb-0">Buat Jadwal Baru</h3>
          <i class="bi bi-plus-circle toggle-header__icon" id="tambahJadwalIcon"></i>
        </div>
        <form id="formJadwal" novalidate class="d-none">
          <div class="form-group" id="group-subject">
            <label class="form-label" for="subject_id"
              >Mata Pelajaran <span class="required">*</span></label
            >
            <select class="form-input" id="subject_id" name="subject_id" required>
              <option value="">— Pilih Mata Pelajaran —</option>
            </select>
            <small class="field-error" id="err-subject"></small>
          </div>

          <div class="form-group" id="group-teacher">
            <label class="form-label" for="teacher_id"
              >Guru Pengampu <span class="required">*</span></label
            >
            <select class="form-input" id="teacher_id" name="teacher_id" required>
              <option value="">— Pilih Guru —</option>
            </select>
            <small class="field-error" id="err-teacher"></small>
          </div>

          <div class="form-group" id="group-hari">
            <label class="form-label" for="hari">Hari <span class="required">*</span></label>
            <select class="form-input" id="hari" name="hari" required>
              <option value="">— Pilih Hari —</option>
              <option value="Senin">Senin</option>
              <option value="Selasa">Selasa</option>
              <option value="Rabu">Rabu</option>
              <option value="Kamis">Kamis</option>
              <option value="Jumat">Jumat</option>
              <option value="Sabtu">Sabtu</option>
            </select>
            <small class="field-error" id="err-hari"></small>
          </div>

          <div class="form-row">
            <div class="form-group" id="group-jam_mulai">
              <label class="form-label" for="jam_mulai"
                >Jam Mulai <span class="required">*</span></label
              >
              <input type="time" class="form-input" id="jam_mulai" name="jam_mulai" required />
              <small class="field-error" id="err-jam_mulai"></small>
            </div>

            <div class="form-group" id="group-jam_selesai">
              <label class="form-label" for="jam_selesai"
                >Jam Selesai <span class="required">*</span></label
              >
              <input type="time" class="form-input" id="jam_selesai" name="jam_selesai" required />
              <small class="field-error" id="err-jam_selesai"></small>
            </div>
          </div>

          <div class="form-group" id="group-ruangan">
            <label class="form-label" for="ruangan">Ruangan <span class="required">*</span></label>
            <input
              type="text"
              class="form-input"
              id="ruangan"
              name="ruangan"
              placeholder="Contoh: R-101 / Lab Komputer 1"
              maxlength="50"
              required
            />
            <small class="field-error" id="err-ruangan"></small>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn--primary" id="btnSimpanJadwal">
              <span class="btn__text" id="btnSimpanText">Simpan Jadwal</span>
              <span class="btn__loader" id="btnSimpanLoader" hidden>
                <i class="bi bi-arrow-repeat spin"></i> Menyimpan...
              </span>
            </button>
            <button type="reset" class="btn btn--secondary" id="btnReset">Reset</button>
          </div>
        </form>
      </div>
    </div>

    <div class="card">
      <div class="card__body">
        <h3 class="mb-16">Daftar Jadwal Kelas</h3>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>No</th>
                <th>Mata Pelajaran</th>
                <th>Guru</th>
                <th>Hari</th>
                <th>Jam</th>
                <th>Ruangan</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="jadwalTableBody">
              <tr>
                <td colspan="7" class="text-center text-muted">Memuat data...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  <!-- ================= END VIEW ADMIN ================= -->
</div>

<!-- MODAL EDIT JADWAL -->
<div class="modal" id="modal-jadwal" hidden>
  <div class="modal__box">
    <h3>Edit Jadwal Kelas</h3>
    <input type="hidden" id="edit-jadwal-id" />
    <div class="form-group">
      <label class="form-label">Mata Pelajaran <span class="required">*</span></label>
      <select class="form-input" id="edit-jadwal-subject_id"></select>
      <small class="field-error" id="err-edit-subject"></small>
    </div>
    <div class="form-group">
      <label class="form-label">Guru Pengampu <span class="required">*</span></label>
      <select class="form-input" id="edit-jadwal-teacher_id"></select>
      <small class="field-error" id="err-edit-teacher"></small>
    </div>
    <div class="form-group">
      <label class="form-label">Hari <span class="required">*</span></label>
      <select class="form-input" id="edit-jadwal-hari">
        <option value="">— Pilih Hari —</option>
        <option value="Senin">Senin</option>
        <option value="Selasa">Selasa</option>
        <option value="Rabu">Rabu</option>
        <option value="Kamis">Kamis</option>
        <option value="Jumat">Jumat</option>
        <option value="Sabtu">Sabtu</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Jam Mulai <span class="required">*</span></label>
      <input type="time" class="form-input" id="edit-jadwal-jam_mulai" />
      <small class="field-error" id="err-edit-jam_mulai"></small>
    </div>
    <div class="form-group">
      <label class="form-label">Jam Selesai <span class="required">*</span></label>
      <input type="time" class="form-input" id="edit-jadwal-jam_selesai" />
      <small class="field-error" id="err-edit-jam_selesai"></small>
    </div>
    <div class="form-group">
      <label class="form-label">Ruangan <span class="required">*</span></label>
      <input
        type="text"
        class="form-input"
        id="edit-jadwal-ruangan"
        placeholder="Contoh: R-101 / Lab Komputer 1"
        maxlength="50"
      />
      <small class="field-error" id="err-edit-ruangan"></small>
    </div>
    <div class="form-actions">
      <button class="btn btn--primary" id="btnSimpanEditJadwal">Simpan</button>
      <button class="btn btn--secondary" onclick="window.closeModal('modal-jadwal')">Batal</button>
    </div>
  </div>
</div>
