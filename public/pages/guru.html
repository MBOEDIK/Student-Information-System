<div class="page active">
  <div class="page-header">
    <h1>Data Guru</h1>
  </div>

  <div class="alert alert--success" id="alertGuruSuccess" hidden>
    <i class="bi bi-check-circle-fill"></i>
    <span id="alertGuruSuccessMsg"></span>
    <button class="alert__close" onclick="this.parentElement.hidden = true">&times;</button>
  </div>

  <div class="alert alert--error" id="alertGuruError" hidden>
    <i class="bi bi-exclamation-triangle-fill"></i>
    <span id="alertGuruErrorMsg"></span>
    <button class="alert__close" onclick="this.parentElement.hidden = true">&times;</button>
  </div>

  <div class="card mb-24">
    <div class="card__body">
      <div class="toggle-header" id="tambahGuruToggle">
        <h3 class="mb-0">Tambah Data Guru</h3>
        <i class="bi bi-plus-circle toggle-header__icon" id="tambahGuruIcon"></i>
      </div>
      <form id="formRegistrasiGuru" novalidate class="d-none">
        <div class="form-group" id="group-guru-nip">
          <label class="form-label" for="guru-nip">NIP <span class="required">*</span></label>
          <input
            type="text"
            class="form-input"
            id="guru-nip"
            name="nip"
            placeholder="Masukkan NIP"
            maxlength="20"
            required
          />
          <small class="field-error" id="err-guru-nip"></small>
        </div>

        <div class="form-group" id="group-guru-nama">
          <label class="form-label" for="guru-nama"
            >Nama Lengkap <span class="required">*</span></label
          >
          <input
            type="text"
            class="form-input"
            id="guru-nama"
            name="nama"
            placeholder="Masukkan nama lengkap"
            maxlength="100"
            required
          />
          <small class="field-error" id="err-guru-nama"></small>
        </div>

        <div class="form-group" id="group-guru-email">
          <label class="form-label" for="guru-email">Email</label>
          <input
            type="email"
            class="form-input"
            id="guru-email"
            name="email"
            placeholder="Masukkan email"
            maxlength="100"
          />
          <small class="field-error" id="err-guru-email"></small>
        </div>

        <div class="form-group" id="group-guru-status">
          <label class="form-label" for="guru-status">Status</label>
          <select class="form-input" id="guru-status" name="status">
            <option value="aktif">Aktif</option>
            <option value="tidak aktif">Tidak Aktif</option>
          </select>
          <small class="field-error" id="err-guru-status"></small>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn--primary" id="btnRegistrasiGuru">
            <span class="btn__text" id="btnRegistrasiGuruText">Simpan</span>
            <span class="btn__loader" id="btnRegistrasiGuruLoader" hidden>
              <i class="bi bi-arrow-repeat spin"></i> Menyimpan...
            </span>
          </button>
          <button type="reset" class="btn btn--secondary" id="btnResetRegistrasiGuru">Reset</button>
        </div>
      </form>
    </div>
  </div>

  <div class="card">
    <div class="card__body">
      <h3 class="mb-16">Daftar Data Guru</h3>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>No</th>
              <th>NIP</th>
              <th>Nama</th>
              <th>Email</th>
              <th>Status</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="guruTableBody">
            <tr>
              <td colspan="6" class="text-center text-muted">Memuat data...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
