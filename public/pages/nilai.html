<div class="page active">
  <div class="page-header">
    <h1>Nilai</h1>
  </div>

  <!-- VIEW GURU/ADMIN -->
  <div id="nilai-guru-view">
    <p style="color:var(--text-muted);">Fitur input nilai tersedia untuk guru.</p>
  </div>

  <!-- VIEW SISWA: Transkrip Nilai (US 6.3) -->
  <div id="nilai-siswa-view" hidden>
    <div class="page-header">
      <h2>Transkrip Nilai Saya</h2>
    </div>
    <div class="table-wrapper">
      <table class="table">
        <thead>
          <tr>
            <th>No</th>
            <th>Semester</th>
            <th>Mata Pelajaran</th>
            <th>Tugas</th>
            <th>UTS</th>
            <th>UAS</th>
            <th>Rata-rata</th>
          </tr>
        </thead>
        <tbody id="transkripTableBody"></tbody>
      </table>
      <p id="transkripEmpty" class="text-center text-muted" hidden>
        Belum ada data nilai untuk akun ini.
      </p>
    </div>
  </div>
</div>
<!-- VIEW ADMIN: Rangkuman Transkrip (US 6.4) -->
<div id="nilai-admin-view" hidden>
  <div class="page-header">
    <h2>Rangkuman Transkrip Nilai Siswa</h2>
  </div>
  <div id="admin-cari-siswa">
    <select id="selectSiswa" class="form-input"
      onchange="window.loadTranskripAdmin(this.value)">
      <option value="">-- Pilih Siswa --</option>
    </select>
  </div>
  <div id="adminTranskripResult" hidden>
    <div class="page-header">
      <h3 id="adminSiswaInfo"></h3>
      <button class="btn btn--primary" onclick="window.cetakTranskrip()">
        Cetak Transkrip
      </button>
    </div>
    <div class="table-wrapper">
      <table class="table">
        <thead>
          <tr>
            <th>No</th>
            <th>Semester</th>
            <th>Mata Pelajaran</th>
            <th>Tugas</th>
            <th>UTS</th>
            <th>UAS</th>
            <th>Rata-rata</th>
          </tr>
        </thead>
        <tbody id="adminTranskripTableBody"></tbody>
      </table>
      <p id="adminTranskripEmpty" class="text-center text-muted" hidden>
        Belum ada data nilai untuk siswa ini.
      </p>
    </div>
  </div>
</div>
