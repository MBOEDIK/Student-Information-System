<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Student Information System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="card shadow-sm p-4">
            <h2 class="mb-4 text-primary">Dashboard Admin - Sistem Informasi Siswa</h2>
            
            <div class="search-container mb-4">
                <form id="formPencarian" class="d-flex gap-2">
                    <input 
                        type="text" 
                        id="inputKeyword" 
                        class="form-control" 
                        placeholder="Cari siswa berdasarkan Nama atau NIS..." 
                        required
                    >
                    <button type="submit" class="btn btn-primary" id="tombolCari">Cari</button>
                </form>
            </div>

            <div class="table-responsive">
                <table class="table table-bordered table-striped align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>NIS</th>
                            <th>Nama</th>
                            <th>Jenis Kelamin</th>
                            <th>Alamat</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="tabelSiswaBody">
                        <tr>
                            <td colspan="5" class="text-center text-muted py-3">
                                Silakan masukkan kata kunci di atas untuk mencari data siswa.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="js/siswa.js"></script>
</body>
</html>
