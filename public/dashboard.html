<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard — SIS SMK</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body class="dashboard-body">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__brand">
        <i class="bi bi-mortarboard-fill"></i>
        <span>MiSiS</span>
      </div>
      <nav class="sidebar__nav" id="sidebarNav">
        <a href="#" class="nav-item active" data-page="home" id="navHome">
          <i class="bi bi-speedometer2"></i> Dashboard
        </a>
        <a href="#" class="nav-item" data-page="siswa" id="navSiswa">
          <i class="bi bi-people"></i> Data Siswa
        </a>
        <a href="#" class="nav-item" data-page="guru" id="navGuru">
          <i class="bi bi-person-workspace"></i> Data Guru
        </a>

        <hr class="sidebar__divider" />

        <a href="#" class="nav-item" data-page="pendaftaran" id="navPendaftaran">
          <i class="bi bi-person-plus"></i> Pendaftaran Siswa
        </a>
        <a href="#" class="nav-item" data-page="jadwal" id="navJadwal">
          <i class="bi bi-calendar3"></i> Penjadwalan Kelas
        </a>
        <a href="#" class="nav-item" data-page="absensi" id="navAbsensi">
          <i class="bi bi-check2-square"></i> Absensi Resmi
        </a>
        <a href="#" class="nav-item" data-page="nilai" id="navNilai">
          <i class="bi bi-file-earmark-spreadsheet"></i> Transkrip Nilai
        </a>
        <a href="#" class="nav-item" data-page="kesehatan" id="navKesehatan">
          <i class="bi bi-heart-pulse"></i> Catatan Kesehatan
        </a>
        <a href="#" class="nav-item" data-page="konseling" id="navKonseling">
          <i class="bi bi-chat-left-quote"></i> Konseling (BK)
        </a>
      </nav>
      <div class="sidebar__footer">
        <button class="btn-logout" id="btnLogout">
          <i class="bi bi-box-arrow-right"></i> Logout
        </button>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <button class="topbar__toggle" id="sidebarToggle" aria-label="Toggle sidebar">
          <i class="bi bi-list"></i>
        </button>
        <div class="topbar__user" id="topbarUser">
          <i class="bi bi-person-circle"></i>
          <span id="userNameDisplay">...</span>
          <span class="role-badge" id="roleBadge">-</span>
        </div>
      </header>

      <div id="page-container">
        <div class="page active">
          <div class="page-header"><h1>Dashboard</h1></div>
          <p class="text-center text-muted mt-20">Memuat...</p>
        </div>
      </div>

      <!-- MODAL EDIT SISWA -->
      <div class="modal" id="modal-siswa" hidden>
        <div class="modal__box">
          <h3>Edit Data Siswa</h3>
          <input type="hidden" id="edit-siswa-id" />
          <div class="form-group">
            <label class="form-label">Nama</label>
            <input type="text" class="form-input" id="edit-siswa-nama" />
          </div>
          <div class="form-group">
            <label class="form-label">NIS</label>
            <input type="text" class="form-input" id="edit-siswa-nis" />
          </div>
          <div class="form-group">
            <label class="form-label">Jenis Kelamin</label>
            <select class="form-input" id="edit-siswa-jenis_kelamin">
              <option value="Laki-laki">Laki-laki</option>
              <option value="Perempuan">Perempuan</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Alamat</label>
            <input type="text" class="form-input" id="edit-siswa-alamat" />
          </div>
          <div class="form-group">
            <label class="form-label">Status</label>
            <select class="form-input" id="edit-siswa-status">
              <option value="aktif">Aktif</option>
              <option value="tidak aktif">Non-Aktif</option>
            </select>
          </div>
          <div class="form-actions">
            <button class="btn btn--primary" onclick="simpanSiswa()">Simpan</button>
            <button class="btn btn--secondary" onclick="window.closeModal('modal-siswa')">
              Batal
            </button>
          </div>
        </div>
      </div>

      <!-- MODAL EDIT GURU -->
      <div class="modal" id="modal-guru" hidden>
        <div class="modal__box">
          <h3>Edit Data Guru</h3>
          <input type="hidden" id="edit-guru-id" />
          <div class="form-group">
            <label class="form-label">Nama</label>
            <input type="text" class="form-input" id="edit-guru-nama" />
          </div>
          <div class="form-group">
            <label class="form-label">NIP</label>
            <input type="text" class="form-input" id="edit-guru-nip" />
          </div>
          <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" class="form-input" id="edit-guru-email" />
          </div>
          <div class="form-group">
            <label class="form-label">Status</label>
            <select class="form-input" id="edit-guru-status">
              <option value="aktif">Aktif</option>
              <option value="tidak aktif">Non-Aktif</option>
            </select>
          </div>
          <div class="form-actions">
            <button class="btn btn--primary" onclick="simpanGuru()">Simpan</button>
            <button class="btn btn--secondary" onclick="window.closeModal('modal-guru')">
              Batal
            </button>
          </div>
        </div>
      </div>
    </main>

    <script src="/js/shared.js"></script>
    <script src="/js/router.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/siswa.js"></script>
    <script src="/js/guru.js"></script>
    <script src="/js/jadwal.js"></script>
    <script src="/js/absensi.js"></script>
    <script src="/js/kesehatan.js"></script>
    <script src="/js/nilai.js"></script>
    <script src="/js/konseling.js"></script>
  </body>
</html>
