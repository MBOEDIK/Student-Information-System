<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Student Information System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet" />
</head>
<body>

<div class="login-wrapper">

  <div class="panel-left">
    <div class="panel-left__inner">
      <div class="brand">
        <div class="brand__logo"><i class="bi bi-mortarboard-fill"></i></div>
        <h1 class="brand__name">MiSiS</h1>
        <p class="brand__tagline">Student Information System</p>
      </div>
      <div class="panel-left__illustration">
        <svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg" class="hero-svg">
          <rect x="60" y="120" width="280" height="160" rx="8" fill="rgba(255,255,255,0.08)"/>
          <rect x="80" y="100" width="240" height="30"   rx="4" fill="rgba(255,255,255,0.12)"/>
          <rect x="160" y="80" width="80"  height="28"   rx="4" fill="rgba(255,255,255,0.15)"/>
          <rect x="90" y="148"  width="40" height="40"   rx="4" fill="rgba(255,255,255,0.15)"/>
          <rect x="148" y="148" width="40" height="40"   rx="4" fill="rgba(255,255,255,0.15)"/>
          <rect x="206" y="148" width="40" height="40"   rx="4" fill="rgba(255,255,255,0.15)"/>
          <rect x="264" y="148" width="40" height="40"   rx="4" fill="rgba(255,255,255,0.15)"/>
          <rect x="168" y="210" width="64" height="70"   rx="4" fill="rgba(255,255,255,0.20)"/>
          <line x1="200" y1="55" x2="200" y2="85" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
          <rect x="200" y="55" width="24" height="14"    rx="2" fill="rgba(255,255,255,0.5)"/>
        </svg>
      </div>
    </div>
  </div>

  <div class="panel-right">
    <div class="form-container">

      <div class="alert alert--error" id="flashAlert" hidden>
        <i class="bi bi-exclamation-triangle-fill alert__icon"></i>
        <span class="alert__text" id="flashMsg"></span>
        <button class="alert__close" onclick="dismissAlert()" aria-label="Tutup">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>

      <div class="form-header">
        <h2 class="form-header__title">Selamat Datang</h2>
        <p class="form-header__subtitle">Masuk ke akun Anda untuk melanjutkan</p>
      </div>

      <div id="loginForm">
        <div class="form-group" id="group-username">
          <label class="form-label" for="username">
            <i class="bi bi-person-badge"></i> Username / NIS / NIP
          </label>
          <div class="input-wrapper">
            <input type="text" id="username" class="form-input"
              placeholder="admin / 20240001 / 19800101"
              autocomplete="username" autofocus />
            <span class="input-icon"><i class="bi bi-person"></i></span>
          </div>
          <span class="form-error" id="err-username"></span>
        </div>

        <div class="form-group" id="group-password">
          <label class="form-label" for="password">
            <i class="bi bi-shield-lock"></i> Password
          </label>
          <div class="input-wrapper">
            <input type="password" id="password" class="form-input"
              placeholder="Masukkan password Anda"
              autocomplete="current-password" />
            <button type="button" class="input-toggle-pass" onclick="togglePassword()" aria-label="Tampilkan">
              <i class="bi bi-eye" id="eyeIcon"></i>
            </button>
          </div>
          <span class="form-error" id="err-password"></span>
        </div>

        <button class="btn-login" id="btnLogin" onclick="doLogin()">
          <span class="btn-login__text">Masuk</span>
          <span class="btn-login__loader" hidden>
            <i class="bi bi-arrow-repeat spin"></i> Memproses...
          </span>
          <i class="bi bi-arrow-right btn-login__arrow"></i>
        </button>

      </div>

      <p class="form-help">
        <i class="bi bi-info-circle"></i>
        Siswa gunakan <strong>NIS</strong> · Guru gunakan <strong>NIP</strong> · Admin gunakan <strong>username</strong>
      </p>

    </div>
  </div>

</div>

<script src="/js/shared.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
