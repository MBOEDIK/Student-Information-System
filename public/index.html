<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Student Information System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="login-container">
    <h2>Student Information System</h2>
    <form id="form-login" onsubmit="event.preventDefault(); window.doLogin();">
      <div id="group-username">
        <label>Username</label>
        <input type="text" class="form-input" id="username" placeholder="Masukkan username" />
        <small class="field-error" id="err-username"></small>
      </div>
      <div id="group-password">
        <label>Password</label>
        <input type="password" class="form-input" id="password" placeholder="Masukkan password" />
        <small class="field-error" id="err-password"></small>
      </div>
      <button type="submit">Login</button>
    </form>
  </div>
  <script src="/js/auth.js"></script>
</body>
</html>
